<!DOCTYPE html>
<html>
<head><style>
  body { margin:0; background:#111; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:24px; font-family:sans-serif; color:#aaa; }
  .sizes { display:flex; align-items:flex-end; gap:32px; }
  .size-box { display:flex; flex-direction:column; align-items:center; gap:10px; }
  img { display:block; }
  span { font-size:12px; }
</style></head>
<body>
  <div class="sizes">
    <div class="size-box">
      <img src="favicon.svg" width="16" height="16">
      <span>16×16 (tab)</span>
    </div>
    <div class="size-box">
      <img src="favicon.svg" width="32" height="32">
      <span>32×32</span>
    </div>
    <div class="size-box">
      <img src="favicon.svg" width="64" height="64">
      <span>64×64</span>
    </div>
    <div class="size-box">
      <img src="favicon.svg" width="128" height="128">
      <span>128×128</span>
    </div>
    <div class="size-box">
      <img src="favicon.svg" width="256" height="256">
      <span>256×256</span>
    </div>
  </div>
</body>
</html>
